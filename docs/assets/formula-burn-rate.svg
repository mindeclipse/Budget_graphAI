<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 155" width="100%" height="155">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-3%" y="-8%" width="106%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="676" height="151" rx="10" ry="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Tag / Badge Header -->
  <g transform="translate(24, 25)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#38bdf8" />
    <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="0.08em">NON-LINEAR WEIGHTED BURNING RATE FORMULA</text>
  </g>

  <!-- Formula Elements -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    
    <!-- Target Daily Burn -->
    <text x="44" y="87" font-size="19" font-weight="700" fill="#f0f6fc" letter-spacing="-0.01em">Target Daily Burn</text>

    <!-- Equal Sign -->
    <text x="232" y="88" font-size="24" font-weight="400" fill="#58a6ff">=</text>

    <!-- Fraction Numerator -->
    <text x="382" y="65" font-size="16.5" font-weight="700" fill="#58a6ff" text-anchor="middle" letter-spacing="-0.01em">Remaining Budget</text>

    <!-- Fraction Divider Line -->
    <line x1="265" y1="80" x2="500" y2="80" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Denominator: Sigma Symbol -->
    <text x="345" y="112" font-family="'Times New Roman', Cambria, Georgia, serif" font-size="29" font-weight="700" fill="#3fb950" text-anchor="middle">∑</text>

    <!-- Denominator: Lower Bound -->
    <text x="345" y="128" font-size="9.5" font-weight="600" fill="#8b949e" text-anchor="middle">d ∈ Remaining Days</text>

    <!-- Denominator: Function w(d) -->
    <text x="408" y="112" font-size="17" font-weight="700" fill="#f0f6fc">w(d)</text>

    <!-- Multiplier Legend (Right Card) -->
    <g transform="translate(524, 52)">
      <rect x="0" y="0" width="130" height="54" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <circle cx="12" cy="19" r="3" fill="#58a6ff" />
      <text x="22" y="22" font-size="10" font-weight="600" fill="#c9d1d9">w<tspan font-size="8" dy="2">weekday</tspan><tspan font-size="10" dy="-2" font-weight="700" fill="#58a6ff"> = 1.00</tspan></text>
      <circle cx="12" cy="38" r="3" fill="#f59e0b" />
      <text x="22" y="41" font-size="10" font-weight="600" fill="#c9d1d9">w<tspan font-size="8" dy="2">weekend</tspan><tspan font-size="10" dy="-2" font-weight="700" fill="#f59e0b"> = 1.35</tspan></text>
    </g>
  </g>
</svg>
